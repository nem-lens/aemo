[package]
name = "nem-lens-aemo"
version = "0.1.0"
edition = "2021"
description = "Pure parsers for AEMO NEMWeb reports: C/I/D CSV tables, DispatchIS snapshots, market time and file names"
license = "BSD-3-Clause"
repository = "https://github.com/nem-lens/aemo"
documentation = "https://nem-lens.github.io/aemo/nem_lens_aemo/"
readme = "README.md"
keywords = ["aemo", "nem", "electricity", "energy-market", "parser"]
categories = ["parser-implementations", "science", "wasm"]
# Not on crates.io (owner, 20 Oct 2026); docs are on GitHub Pages.
publish = false
# The tests read real AEMO files, which stay in the repository under AEMO's
# terms and are not shipped in any package.
exclude = ["/tests", "/.github", "/.gitattributes"]

[dependencies]
anyhow = "1"
# No `clock` feature: the crate never reads the system time, which keeps it
# deterministic and buildable for wasm32-unknown-unknown.
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
chrono-tz = "0.10"
csv = "1"
# NEMDE case files (nemde). Pure Rust, no default features: wasm32-safe.
quick-xml = { version = "0.41", default-features = false }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
